services:
   berry-bot-discord:
      build:
         context: ./berry-bot-discord/
         dockerfile: ./Dockerfile
      container_name: berry-bot-discord
      develop:
         watch:
            - path: ./berry-bot-discord/
              action: rebuild
            - path: ./package-lock.json
              action: rebuild
      environment:
         TZ: "Europe/London"
         PYTHONUNBUFFERED: "1"
      labels:
         com.fennec.app_type: discord
         com.fennec.app_name: berry-bot
      restart: on-failure